name: Ticketio

services:

  ticketio-ui:
    build:
      context: .
      dockerfile: src/frontend/Ticketio.UI/Dockerfile
    ports:
      - "3000:80"
    networks:
      - ticketio-network
    env_file:
      - .env
  ticketio-api:
    build:
      context: .
      dockerfile: src/backend/Ticketio.Api/Dockerfile
    ports:
      - "8080:8080"
    networks:
      - ticketio-network
    env_file:
      - .env
            
  ticketio-auth:
    build:
      context: .
      dockerfile: src/backend/Ticketio.Auth.Api/Dockerfile
    networks:
      - ticketio-network
    env_file:
      - .env
    
    
networks:
  ticketio-network: