name: Ticketio - Build and Test

on:
  push:
    paths:
      - 'src/backend/**'
      - 'src/tests/**'
      - 'Ticketio.slnx'
    branches:
      - development

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List dotnet projects
        run: find ./src/backend -name "*.csproj" | sort
      
      - name: Setup dotnet 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dotnet packages
        run: dotnet restore Ticketio.slnx

      - name: Build projects
        run: dotnet build Ticketio.slnx --no-restore

      - name: Run tests
        run: dotnet test Ticketio.slnx --no-build

  code-security-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3