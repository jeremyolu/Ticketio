name: Ticketio - Build and Test

on:
  push:
    branches:
      - development

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup dotnet 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dotnet packages
        run: dotnet restore Ticketio.slnx

      - name: Build projects
        run: dotnet build Ticketio.slnx --no-restore

      - name: Run tests
        run: dotnet test Ticketio.slnx --no-build