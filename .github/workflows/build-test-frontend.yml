name: Ticketio - Build and Test Frontend

on:
  push:
    paths:
      - 'src/frontend/**'
    branches:
      - development

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend/Ticketio.UI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/Ticketio.UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  code-security-scan:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend/Ticketio.UI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check npm vulnerabilities
        run: npm audit --audit-level=high
